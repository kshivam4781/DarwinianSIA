[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sia-cabs"
version = "0.1.0"
description = "SIA-CABS: Contradiction-Aware Belief System for self-improving AI research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
sia-cabs = "sia_cabs.orchestrator:main"
sia-cabs-tools = "sia_cabs.cli:main"

[tool.setuptools.packages.find]
include = ["cabs*", "sia_cabs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
